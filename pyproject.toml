[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "End-to-end customer-churn prediction: scikit-learn pipeline, FastAPI service, Docker, MLflow tracking and CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marcos Lahoz" }]
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3",
    "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0", "mlflow>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
